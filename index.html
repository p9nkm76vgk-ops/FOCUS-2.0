:root[data-theme=light]{color-scheme:light;--bg:#f4f1ea;--surface:#ffffff;--surface2:#ede9e0;--surface3:#e3ded2;--line:#dcd6c8;--line2:#c9c2b2;--text:#1d1b17;--muted:#645f55;--accent:#7b5a12;--accent2:#5f450c;--accent-ink:#ffffff;--accent-soft:#7b5a1218;--warn:#a8321c;--ok:#2f7a45;--info:#2f5fb3;--shadow:0 12px 40px #3d34221f;--shadow-sm:0 1px 2px #3d342218,0 6px 18px #3d34220f;--glow:#7b5a1210}

p,small,li{max-width:68ch}b{font-weight:650}a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button,a,summary,[data-a],label{touch-action:manipulation}
.ic{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* menú lateral */
.side{position:fixed;inset:0 auto 0 0;width:276px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;overflow-y:auto;padding:max(20px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));z-index:30;transition:transform .2s ease,width .2s ease}

.nv{display:flex;justify-content:flex-start;align-items:center;gap:14px;width:100%;min-height:46px;padding:9px 14px;border:0;border-radius:12px;background:transparent;color:var(--muted);font:inherit;font-size:.98rem;text-align:left;cursor:pointer;font-weight:500}

.nv.sub{min-height:44px;padding-left:52px;font-size:.93rem}.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;display:inline-block;vertical-align:-1px;margin-right:2px}.nv .dot{margin-left:-24px;margin-right:12px}

@media(max-width:999px){.side{transform:translateX(-102%);width:min(330px,88vw)}body.open .side{transform:none;box-shadow:var(--shadow)}.main,body.rail .main{margin-left:0;padding:18px 16px 60px}body.rail .side{width:min(330px,88vw)}body.rail .lbl,body.rail .chev,body.rail .nv.sub{display:revert}body.rail .nv{justify-content:flex-start;padding:9px 14px}body.rail .brand span{display:revert}
 #topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left))}#topbar b{font-size:1.05rem}#menuBtn{min-width:46px;padding:0;display:inline-flex;align-items:center;justify-content:center}
 body.open .scrim{display:block;position:fixed;inset:0;background:rgb(0 0 0 / .66);z-index:25}}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.m,small,em{color:var(--muted)}small{display:block;font-size:.9rem}em{font-size:.9rem;font-style:normal}

.empty{border:1.5px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted)}
/* bloques del calendario: SOLO dos tipos. Obligatorio = relleno; Sugerido = solo contorno. */
.blk{--bgc:var(--surface2);background:var(--bgc);border:1px solid transparent;border-left:5px solid var(--c);border-radius:12px;padding:10px 12px;margin:0 0 8px;display:flex;flex-direction:column;gap:2px}
.blk.ob{background:color-mix(in srgb,var(--c) 15%,var(--surface))}
.blk.hab{background:transparent;border:1.5px solid color-mix(in srgb,var(--c) 60%,transparent);border-left-width:5px}
.blk.act{background:var(--surface2);border-left-color:var(--muted)}
.blk .bh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.blk .bh b{font-size:.95rem}.blk .who{font-weight:600}.blk .kind{margin-left:auto;font-size:.875rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.blk small{font-size:.88rem}.blk .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.blk .acts button{min-height:44px;padding:4px 14px;font-size:.92rem}
.blk[data-a=blkMenu]{cursor:pointer}.blk[data-a=blkMenu]:hover{border-color:var(--muted)}.blk.done{opacity:.7}.blk.done .bh b:after{content:" ✓";color:var(--ok)}.blk.skipped,.blk.rescheduled,.blk.replaced{opacity:.5}.blk.displaced{border-color:var(--warn)}

.wk{display:grid;grid-template-columns:repeat(7,minmax(160px,1fr));gap:12px;overflow-x:auto;max-width:100%;padding-bottom:8px}.wk>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}.wk h3{font-size:.875rem;margin:0 0 10px;text-transform:none;letter-spacing:0;color:var(--text)}.wk .blk{padding:8px 10px;font-size:.92rem}.wk .det{display:none}.wk .kind{display:none}
/* botones y formularios */

button,.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:550}
button:hover,.btn:hover{border-color:var(--muted)}button:active{transform:scale(.98)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}button.pri:hover{filter:brightness(1.07)}button.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
label{display:block;margin:0 0 14px;color:var(--muted);font-size:.95rem}label input,label select,label textarea{display:block;width:100%;margin-top:6px;color:var(--text);background:var(--bg)}input[type=color]{padding:3px;width:68px;min-width:68px}label.chk{display:flex;align-items:center;gap:12px;color:var(--text);min-height:44px;padding:4px 0}label.chk input{width:22px;height:22px;margin:0;min-height:0}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:24px;width:min(660px,94vw);max-height:92vh;max-height:92dvh;overflow:auto;padding:24px;box-shadow:var(--shadow)}dialog::backdrop{background:rgb(0 0 0 / .72)}dialog h3{font-size:1.35rem;text-transform:none;letter-spacing:-.01em;color:var(--text);margin-bottom:1em}

fieldset.fs{border:0;padding:0;margin:0 0 20px}fieldset.fs legend{padding:0;margin:0 0 8px;color:var(--muted);font-size:.875rem;font-weight:650;text-transform:uppercase;letter-spacing:.08em}fieldset.fs small{margin-top:6px}
.chips2{display:flex;flex-wrap:wrap;gap:8px}label.ch{position:relative;margin:0;display:block;color:var(--text)}label.ch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;min-height:0;cursor:pointer}

label.ch input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}label.ch input:checked+span .dot{box-shadow:0 0 0 2px var(--accent-ink)}label.ch input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
details.more{margin:6px 0 4px;border-top:1px solid var(--line);padding-top:6px}details.more summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--accent);font-weight:600;list-style:none}details.more summary::-webkit-details-marker{display:none}details.more summary:before{content:"+";font-size:1.3rem;margin-right:10px;width:1ch}details.more[open] summary:before{content:"−"}
.item{display:flex;gap:14px;align-items:center;cursor:pointer;border-left:5px solid var(--c)}.item>div{flex:1}.item>.dot{display:none}.item:hover{border-color:var(--muted);border-left-color:var(--c)}.chk2{min-width:46px;padding:0;border-radius:50%}
.tag{display:inline-block;font-size:.875rem;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-weight:600;line-height:1.5}.tag.hi{border-color:var(--warn);color:var(--warn)}
.bar{height:8px;border-radius:6px;background:var(--surface2);margin:8px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.cols{display:flex;gap:8px;align-items:flex-end;height:120px}.cols div{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%}.cols i{flex:1;background:var(--accent);border-radius:5px 5px 0 0}.cols i.p{background:transparent;border:1.5px solid var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0}.legend span{display:inline-flex;gap:8px;align-items:center;font-size:.93rem}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.chips button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* Calendario con eje horario */
.tg{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:clip}
.tg .ax{position:relative;width:46px;flex:none;margin-top:0}.tg .axh{height:42px;position:sticky;top:var(--stick,0);z-index:5;background:var(--surface)}.tg.hasnos .axh{height:100px}

.tg .axb{position:relative}
.tg .days{flex:1;min-width:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}

.tg .dc .av{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--accent) 7%,transparent);pointer-events:none}

.tg .ev b{font-size:.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tg .ev span,.tg .ev small{font-size:.875rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tg .ev.act{background:var(--surface2);border-left-color:var(--muted)}
.tg .ev.done{opacity:.65}.tg .ev.done b:after{content:" ✓";color:var(--ok)}.tg .ev.skipped,.tg .ev.rescheduled,.tg .ev.replaced{opacity:.45;text-decoration:line-through}

@media(max-width:999px){:root{--stick:57px}}

/* v6: objetivos, temario, curso, revisión, vista de día */
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;border-radius:99px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}.trow .tn{min-width:140px;flex:1}.trow .tn small{display:block;color:var(--muted);font-size:.875rem}

.hb{display:flex;gap:10px;flex-wrap:wrap}.hb button.big{min-height:52px;padding:8px 22px;font-size:1.05rem;border-radius:14px}
.chip{display:inline-block;font-size:.875rem;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);vertical-align:middle}.chip.hot{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

 async function sync(o){o=o||{};if(!st.session||busy||typeof fetch!=='function')return;if(!o.force&&Date.now()-lastTry<10000)return;lastTry=Date.now();busy=true;err='';note();

/* Horario de clases: una línea por clase («08:00-08:55 Matemáticas II»). Se guarda en el estado (S.timetable) y se exporta al Calendario con aviso 10 min antes. */
const TT={
 line:/^(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})\s+(\S.*)$/,
 parse(txt,day){const out=[];let n=0;for(const raw of String(txt||'').split('\n')){const l=raw.trim();if(!l)continue;n++;const m=TT.line.exec(l);if(!m)return{err:`${DOW[day]}, línea ${n}: usa «08:00-08:55 Asignatura».`};
  const s=+m[1]*60+ +m[2],e=+m[3]*60+ +m[4];if(+m[1]>23||+m[3]>23||+m[2]>59||+m[4]>59||e<=s)return{err:`${DOW[day]}, línea ${n}: la hora de fin debe ser posterior a la de inicio.`};
  out.push({id:`c${day}-${s}`,day,start:s,end:e,name:m[5].trim().slice(0,60)})}
  for(let i=1;i<out.length;i++){const a=[...out].sort((x,y)=>x.start-y.start);for(let j=1;j<a.length;j++)if(a[j].start<a[j-1].end)return{err:`${DOW[day]}: «${a[j-1].name}» y «${a[j].name}» se solapan.`}}
  return{list:out}},
 text:day=>(S.timetable||[]).filter(c=>c.day===day).sort((a,b)=>a.start-b.start).map(c=>`${fm(c.start)}-${fm(c.end)} ${c.name}`).join('\n'),
 next(n){const t=S.timetable||[];if(!t.length)return null;for(let k=0;k<8;k++){const d=addDays(n.date,k),wdn=weekday(d);const c=t.filter(x=>x.day===wdn&&(k>0||x.start>n.minute)).sort((a,b)=>a.start-b.start)[0];if(c)return{...c,date:d,k}}return null},
 card(){const days=[1,2,3,4,5];return`<details class=more data-k=ttc${typeof HY!=='undefined'&&HY.open.ttc?' open':''}><summary>Horario de clases y avisos 10 min antes${(S.timetable||[]).length?` · ${(S.timetable||[]).length} clases`:''}</summary><div class=card><p class=m>Una clase por línea, por ejemplo <b>08:00-08:55 Matemáticas II</b>. Con tu horario guardado, el archivo del Calendario incluye cada clase con un aviso <b>10 min antes</b>, así no tienes que mirar el horario.</p>${days.map(d=>`<label class=m for=tt${d}>${['','Lunes','Martes','Miércoles','Jueves','Viernes'][d]}</label><textarea id=tt${d} rows=${Math.max(2,TT.text(d).split('\n').length+1)} style="width:100%;margin-bottom:8px" placeholder="08:00-08:55 Matemáticas II">${esc(TT.text(d))}</textarea>`).join('')}<div class=row style="justify-content:flex-start"><button class=pri data-a=ttSave>Guardar horario</button><button data-a=icsAsk>Descargar avisos para el Calendario</button></div><p class=m id=ttMsg></p></div></details>`}};
{const aj3=V.aj;V.aj=a=>aj3(a).replace('<h1>Ajustes</h1>','<h1>Ajustes</h1>'+TT.card())}
Object.assign(A,{ttSave:()=>{const all=[];for(const d of [1,2,3,4,5]){const el=document.getElementById('tt'+d),r=TT.parse(el?el.value:'',d);if(r.err){const m=document.getElementById('ttMsg');if(m)m.textContent=r.err;return toast(r.err)}all.push(...r.list)}

${keep}${tail}`}}

/* Temporizador: tarjeta con anillo de progreso y modo concentración a pantalla completa. El tiempo sale de UI.timer.at (sigue aunque cierres la app). */
const tmRing=(e,p,col,txt)=>{const r=52,c=2*Math.PI*r,f=Math.max(0,Math.min(1,e/Math.max(1,p))),over=e>p;return`<svg class=ring viewBox="0 0 120 120" role=img aria-label="${e} de ${p} minutos"><circle cx=60 cy=60 r=${r} class=rt /><circle cx=60 cy=60 r=${r} class=rv data-ring data-p=${p} style="stroke:${over?'var(--ok)':col};stroke-dasharray:${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 60 60)"/><text x=60 y=57 text-anchor=middle class=rn data-timer>${txt} min</text><text x=60 y=76 text-anchor=middle class=rl>previstos ${p}</text></svg>`};
function timerCard(){const t=UI.timer;if(!t)return'';const b=S.blocks.find(x=>x.id===t.id&&x.status==='planned');if(!b){UI.timer=null;saveUI();return''}
 const w=wk(b.workId)||{},s=sub(w.subjectId),ph=phaseOf(b),e=elapsedMin(),p=b.end-b.start,how=howOf(b,s);
 return`<div class="card timer" style="--c:${s.color}"><div class=tmr>${tmRing(e,p,s.color,e)}<div class=tmi><small class=lab>En marcha</small><h2>${esc(s.name)}</h2><p class=m>${esc(w.title||'')}${ph?` <span class=chip>${esc(ph.label)}</span>`:''}</p><small class=m data-over>${overTxt(b)}</small></div></div>${how?`<details class=how2 open><summary>Qué hacer</summary><p>${esc(how)}</p></details>`:''}<div class=row style="justify-content:flex-start;margin-top:8px"><button class=pri data-a=timerEnd>Terminar y guardar</button><button data-a=focusOn>Modo concentración</button><button data-a=timerDetail>Con detalle</button><button data-a=timerCancel>Cancelar</button></div></div>`}
const focusHtml=()=>{const t=UI.timer,b=t&&S.blocks.find(x=>x.id===t.id&&x.status==='planned');if(!b)return'';const w=wk(b.workId)||{},s=sub(w.subjectId),ph=phaseOf(b),p=b.end-b.start;
 return`<div class=fcs style="--c:${s.color}"><button class=fx data-a=focusOff aria-label="Salir del modo concentración">✕</button><small class=lab>${esc(s.name)}${ph?' · '+esc(ph.label):''}</small><div class=big data-fbig>00:00</div><p class=fsub>${esc(w.title||'')} · previstos ${p} min</p><div class=fbar><i data-fbar></i></div><p class=fhow>${esc(howOf(b,s))}</p><div class=row style="justify-content:center"><button class=pri data-a=focusEnd>Terminar y guardar</button><button data-a=focusOff>Salir</button></div></div>`};
let FTM=null;
const focusTick=()=>{const t=UI.timer,b=t&&S.blocks.find(x=>x.id===t.id);if(!b){focusClose();return}const sec=Math.max(0,Math.floor((Date.now()-t.at)/1000)),m=Math.floor(sec/60),p=(b.end-b.start)*60;
 const bg=document.querySelector('[data-fbig]'),br=document.querySelector('[data-fbar]');if(bg)bg.textContent=pad(Math.floor(m/60)?Math.floor(m/60):0)+':'+pad(m%60)+':'+pad(sec%60);if(br)br.style.width=Math.min(100,100*sec/p)+'%'};
function focusClose(){clearInterval(FTM);FTM=null;const f=document.getElementById('focus');if(f)f.remove();document.body.classList.remove('focusing')}
Object.assign(A,{focusOn:()=>{const h=focusHtml();if(!h)return;focusClose();const d=document.createElement('div');d.id='focus';d.innerHTML=h;{const m=/--c:([^"]+)"/.exec(h);if(m)d.style.setProperty('--c',m[1])}document.body.appendChild(d);document.body.classList.add('focusing');focusTick();FTM=setInterval(focusTick,1000)},focusOff:()=>focusClose(),focusEnd:()=>{focusClose();A.timerEnd()}});
try{setInterval(()=>{document.querySelectorAll('[data-ring]').forEach(r=>{const p=+r.dataset.p,e=elapsedMin(),c=2*Math.PI*52;r.style.strokeDasharray=(c*Math.min(1,e/p)).toFixed(1)+' '+c.toFixed(1);if(e>p)r.style.stroke='var(--ok)'})},15000)}catch{}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('focus'))focusClose()});

boot();
</script></body></html>
